# Nginx Configuration for Website (Domain Only)
server_tokens off;
client_max_body_size 120M;
client_body_timeout 300s;
resolver 127.0.0.11 valid=10s ipv6=off;

# Only Next.js Server Actions carry the Next-Action header. An empty key is not
# counted, so login, registration, downloads, and other API routes remain usable.
map $http_next_action $dashboard_action_limit_key {
    default "";
    ~.+ $binary_remote_addr;
}
limit_req_zone $dashboard_action_limit_key zone=dashboard_actions:10m rate=10r/s;
limit_req_status 429;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name pm25-patients.ddc.moph.go.th 192.168.110.5 _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pm25-patients.ddc.moph.go.th 192.168.110.5 _;

    # Serve the leaf certificate together with the DigiCert intermediate.
    # The leaf-only .crt causes clients without a cached intermediate CA to
    # fail certificate validation with ERR_CERT_AUTHORITY_INVALID.
    ssl_certificate /etc/nginx/ssl/live/star_ddc_moph_go_th_ca.crt;
    ssl_certificate_key /etc/nginx/ssl/live/star_ddc_moph_go_th.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location = /airflow {
        return 301 /airflow/;
    }

    # Proxy to Airflow 3 API server / UI.
    # Keep the /airflow prefix because AIRFLOW__API__BASE_URL is configured with it.
    location /airflow/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /airflow;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Proxy to Next.js Web Application
    location / {
        limit_req zone=dashboard_actions burst=20 nodelay;

        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
